<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Data - Basketball Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Global Navigation Bar -->
        <!-- Global Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">🏀 Basketball Shop</a>
        <ul class="nav-links">
            <li><a href="index.html">Users & Roles</a></li>
            <li><a href="md.html" class="active">Master Data</a></li>
            <li><a href="equipment.html">Equipment & Stock</a></li>
            <li><a href="orders.html">Shop Orders</a></li>
            <li><a href="supplierOrders.html">Supplier Orders</a></li>
            <li><a href="shipments.html">Shipments</a></li>
            <li><a href="reports.html">Reports</a></li>
        </ul>
    </nav>

    <main>
      <h1>Master Data Management</h1>

      <!-- Categories Section -->
      <section class="panel">
        <h2>Categories</h2>
        <div class="form-row">
          <div class="field">
            <label for="categoryInput">New Category Name</label>
            <input
              type="text"
              id="categoryInput"
              placeholder="e.g. Footwear, Basketballs"
            />
          </div>
          <div>
            <button class="primary" onclick="addCategory()">
              Add Category
            </button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Category Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categoryTableBody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </section>

      <!-- Brands Section -->
      <section class="panel">
        <h2>Brands</h2>
        <div class="form-row">
          <div class="field">
            <label for="brandInput">New Brand Name</label>
            <input
              type="text"
              id="brandInput"
              placeholder="e.g. Nike, Molten, Wilson"
            />
          </div>
          <div>
            <button class="primary" onclick="addBrand()">Add Brand</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Brand Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="brandTableBody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </section>
    </main>

    <script src="config.js"></script>
    <script>
      const CATEGORIES_API = `${API_BASE_URL}/categories`;
      const BRANDS_API = `${API_BASE_URL}/brands`;

      // --- Fetch & Display Categories (Optimized DOM rendering) ---
      async function loadCategories() {
        try {
          const response = await fetch(CATEGORIES_API);
          const categories = await response.json();
          renderListOptimized(
            "categoryTableBody",
            categories,
            (cat) => `
                        <tr>
                            <td>#${cat.id}</td>
                            <td><strong>${cat.name}</strong></td>
                            <td><button class="delete-btn" onclick="deleteItem('categories', ${cat.id})">Delete</button></td>
                        </tr>
                    `,
            "No categories found.",
          );
        } catch (err) {
          console.error("Error loading categories:", err);
        }
      }

      // --- Add Category ---
      async function addCategory() {
        const input = document.getElementById("categoryInput");
        const name = input.value.trim();
        if (!name) return alert("Please enter a category name");

        try {
          const response = await fetch(CATEGORIES_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });

          if (response.ok) {
            input.value = "";
            loadCategories();
          } else {
            const errData = await response.json();
            alert(`Error: ${errData.error || "Failed to add category"}`);
          }
        } catch (err) {
          console.error("Error adding category:", err);
        }
      }

      // --- Fetch & Display Brands ---
      async function loadBrands() {
        try {
          const response = await fetch(BRANDS_API);
          const brands = await response.json();
          renderListOptimized(
            "brandTableBody",
            brands,
            (brand) => `
                        <tr>
                            <td>#${brand.id}</td>
                            <td><strong>${brand.name}</strong></td>
                            <td><button class="delete-btn" onclick="deleteItem('brands', ${brand.id})">Delete</button></td>
                        </tr>
                    `,
            "No brands found.",
          );
        } catch (err) {
          console.error("Error loading brands:", err);
        }
      }

      // --- Add Brand ---
      async function addBrand() {
        const input = document.getElementById("brandInput");
        const name = input.value.trim();
        if (!name) return alert("Please enter a brand name");

        try {
          const response = await fetch(BRANDS_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });

          if (response.ok) {
            input.value = "";
            loadBrands();
          } else {
            const errData = await response.json();
            alert(`Error: ${errData.error || "Failed to add brand"}`);
          }
        } catch (err) {
          console.error("Error adding brand:", err);
        }
      }

      // --- Generic Delete Function ---
      async function deleteItem(type, id) {
        if (
          !confirm(`Are you sure you want to delete this ${type.slice(0, -1)}?`)
        )
          return;

        try {
          const response = await fetch(`${API_BASE_URL}/${type}/${id}`, {
            method: "DELETE",
          });

          if (response.ok) {
            if (type === "categories") loadCategories();
            if (type === "brands") loadBrands();
          } else {
            alert("Failed to delete item.");
          }
        } catch (err) {
          console.error("Error deleting item:", err);
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        loadCategories();
        loadBrands();
      });
    </script>
  </body>
</html>

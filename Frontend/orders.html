<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Orders - Basketball Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Global Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">🏀 Basketball Shop</a>
        <ul class="nav-links">
            <li><a href="index.html">Users & Roles</a></li>
            <li><a href="md.html">Master Data</a></li>
            <li><a href="orders.html" class="active">Shop Orders</a></li>
            <li><a href="supplierOrders.html">Supplier Orders</a></li>
            <li><a href="shipments.html">Shipments</a></li>
        </ul>
    </nav>

    <main>
        <h1>Basketball Shop - Order Management & Join Report</h1>

        <div id="loading" class="message loading" style="display: none;">Loading orders...</div>
        <div id="error" class="message error" style="display: none;"></div>

        <!-- Create Order Panel -->
        <section class="panel">
            <h2>Create New Order</h2>
            <form id="orderForm">
                <div class="form-row">
                    <div class="field">
                        <label for="userId">Customer User ID</label>
                        <input type="number" id="userId" placeholder="e.g. 1" required />
                    </div>
                    <div class="field">
                        <label for="totalAmount">Total Amount ($)</label>
                        <input type="number" step="0.01" id="totalAmount" placeholder="e.g. 149.99" required />
                    </div>
                    <div>
                        <button type="submit" class="primary">Place Order</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Orders Table Panel -->
        <section class="panel">
            <h2>Customer Orders List</h2>
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Customer Email</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="config.js"></script>
    <script>
        const ORDERS_API = `${API_BASE_URL}/orders`;
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');

        function showLoading(show) { loadingEl.style.display = show ? 'block' : 'none'; }
        function showError(msg) { 
            errorEl.innerText = msg; 
            errorEl.style.display = msg ? 'block' : 'none'; 
        }

        async function fetchOrders() {
            showLoading(true);
            showError('');
            try {
                const res = await fetch(ORDERS_API);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Failed to fetch orders');

                renderListOptimized(
                    'ordersTableBody',
                    data.data || [],
                    order => `
                        <tr>
                            <td>#${order.order_id}</td>
                            <td><strong>${order.customer_name || 'N/A'}</strong></td>
                            <td>${order.customer_email || 'N/A'}</td>
                            <td>$${parseFloat(order.total_amount).toFixed(2)}</td>
                            <td><span class="status-tag ${order.order_status}">${order.order_status}</span></td>
                            <td>
                                <button onclick="updateStatus(${order.order_id}, 'completed')">Mark Completed</button>
                                <button class="delete-btn" onclick="deleteOrder(${order.order_id})">Delete</button>
                            </td>
                        </tr>
                    `,
                    'No shop orders recorded yet.'
                );
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');
            try {
                const res = await fetch(ORDERS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: document.getElementById('userId').value,
                        total_amount: document.getElementById('totalAmount').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Failed to create order');
                document.getElementById('userId').value = '';
                document.getElementById('totalAmount').value = '';
                fetchOrders();
            } catch (err) {
                showError(err.message);
            }
        });

        async function updateStatus(id, status) {
            try {
                const res = await fetch(`${ORDERS_API}/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_status: status })
                });
                if (!res.ok) throw new Error('Failed to update status');
                fetchOrders();
            } catch (err) {
                showError(err.message);
            }
        }

        async function deleteOrder(id) {
            if (!confirm('Are you sure you want to delete this order?')) return;
            try {
                const res = await fetch(`${ORDERS_API}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete order');
                fetchOrders();
            } catch (err) {
                showError(err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>
</html>

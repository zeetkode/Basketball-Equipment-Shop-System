<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f9f9f9; }
    h2, h3 { color: #333; }
    form { margin-bottom: 20px; display: flex; gap: 10px; }
    input, button { padding: 8px; font-size: 14px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f1f1f1; }
    .status-tag { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .pending { background: #ffeaa7; color: #d63031; }
    .completed { background: #55efc4; color: #00b894; }
    .feedback { margin-top: 10px; font-weight: bold; }
    .error { color: #d63031; }
    .loading { color: #0984e3; }
  </style>
</head>
<body>
  <h2>Basketball Shop - Order Management & Join Report</h2>

  <div id="loading" class="feedback loading" style="display: none;">Loading orders...</div>
  <div id="error" class="feedback error" style="display: none;"></div>

  <h3>Create New Order</h3>
  <form id="orderForm">
    <input type="number" id="userId" placeholder="User ID" required />
    <input type="number" step="0.01" id="totalAmount" placeholder="Total Amount ($)" required />
    <button type="submit">Place Order</button>
  </form>

  <table id="ordersTable">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Customer Name</th>
        <th>Customer Email</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const tbody = document.querySelector('#ordersTable tbody');

    function showLoading(show) { loadingEl.style.display = show ? 'block' : 'none'; }
    function showError(msg) { 
      errorEl.innerText = msg; 
      errorEl.style.display = msg ? 'block' : 'none'; 
    }

    async function fetchOrders() {
      showLoading(true);
      showError('');
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to fetch orders');

        tbody.innerHTML = '';
        data.data.forEach(order => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>#${order.order_id}</td>
            <td>${order.customer_name}</td>
            <td>${order.customer_email}</td>
            <td>$${parseFloat(order.total_amount).toFixed(2)}</td>
            <td><span class="status-tag ${order.order_status}">${order.order_status}</span></td>
            <td>
              <button onclick="updateStatus(${order.order_id}, 'completed')">Mark Completed</button>
              <button onclick="deleteOrder(${order.order_id})">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        showError(err.message);
      } finally {
        showLoading(false);
      }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: document.getElementById('userId').value,
            total_amount: document.getElementById('totalAmount').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to create order');
        document.getElementById('userId').value = '';
        document.getElementById('totalAmount').value = '';
        fetchOrders();
      } catch (err) {
        showError(err.message);
      }
    });

    async function updateStatus(id, status) {
      try {
        const res = await fetch(`/api/orders/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_status: status })
        });
        if (!res.ok) throw new Error('Failed to update status');
        fetchOrders();
      } catch (err) {
        showError(err.message);
      }
    }

    async function deleteOrder(id) {
      if (!confirm('Are you sure you want to delete this order?')) return;
      try {
        const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete order');
        fetchOrders();
      } catch (err) {
        showError(err.message);
      }
    }

    fetchOrders();
  </script>
</body>
</html>

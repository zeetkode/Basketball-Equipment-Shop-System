<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basketball Equipment Shop</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      .form-group {
        margin-bottom: 10px;
      }
      button {
        margin-left: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>System Users (INNER JOIN Report)</h1>
    
<!-- Navigation Button to Orders Page -->
  <div style="margin-bottom: 20px;">
    <a href="orders.html" style="text-decoration: none;">
      <button type="button" style="padding: 10px 18px; background-color: #ff6600; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">
        🏀 Go to Orders Management
      </button>
    </a>
  </div>

    <!-- User Creation Form -->
    <h3>Create New User</h3>
    <form id="createUserForm">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" required />
      </div>
      <div class="form-group">
        <label for="role_id">Role:</label>
        <select id="role_id" required>
          <option value="1">Admin</option>
          <option value="2">Customer</option>
        </select>
      </div>
      <button type="submit">Create User</button>
    </form>
    <p id="form-status"></p>

    <hr />

    <!-- User List -->
    <h3>Current Users</h3>
    <p id="status">Loading users...</p>
    <ul id="user-list"></ul>

    <script>
      const apiUrl = "http://localhost:3000/api/users";

      // Fetch and display users
      function loadUsers() {
        fetch(apiUrl)
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("status").innerText =
              "Data loaded successfully!";
            document.getElementById("status").className = "success";
            const list = document.getElementById("user-list");
            list.innerHTML = ""; // Clear existing list to prevent duplicates

            data.forEach((user) => {
              const li = document.createElement("li");
              li.innerText = `User: ${user.username} | Role: ${user.role_name}`;

              // Create Delete Button
              const deleteBtn = document.createElement("button");
              deleteBtn.innerText = "Delete";
              deleteBtn.onclick = () => deleteUser(user.user_id);

              li.appendChild(deleteBtn);
              list.appendChild(li);
            });
          })
          .catch((error) => {
            document.getElementById("status").innerText = "Error loading data.";
            document.getElementById("status").className = "error";
          });
      }

      // Create a new user (POST)
      document
        .getElementById("createUserForm")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // Prevent the page from reloading

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const role_id = document.getElementById("role_id").value;

          fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password, role_id }),
          })
            .then((response) => {
              if (!response.ok) throw new Error("Failed to create user");
              return response.json();
            })
            .then((data) => {
              document.getElementById("form-status").innerText =
                "User created successfully!";
              document.getElementById("form-status").className = "success";
              document.getElementById("createUserForm").reset(); // Clear the form
              loadUsers(); // Refresh the user list immediately
            })
            .catch((error) => {
              document.getElementById("form-status").innerText =
                "Error creating user.";
              document.getElementById("form-status").className = "error";
            });
        });

      // Delete a user (DELETE)
      function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;

        fetch(`${apiUrl}/${id}`, {
          method: "DELETE",
        })
          .then((response) => {
            if (!response.ok) throw new Error("Failed to delete user");
            return response.json();
          })
          .then((data) => {
            loadUsers(); // Refresh the list after deletion
          })
          .catch((error) => {
            alert("Error deleting user.");
          });
      }

      // Load users as soon as the page opens
      loadUsers();
    </script>
  </body>
</html>

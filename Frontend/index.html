<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users & Roles - Basketball Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Global Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="brand">🏀 Basketball Shop</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Users & Roles</a></li>
      <li><a href="md.html">Master Data</a></li>
      <li><a href="orders.html">Shop Orders</a></li>
      <li><a href="supplierOrders.html">Supplier Orders</a></li>
      <li><a href="shipments.html">Shipments</a></li>
    </ul>
  </nav>

  <main>
    <h1>User Management & Role Assignment</h1>

    <!-- Create User Card -->
    <section class="panel">
      <h2>Create New User</h2>
      <form id="createUserForm">
        <div class="form-row">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required />
          </div>
          
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>

          <div class="field">
            <label for="role_id">Role</label>
            <select id="role_id" required>
              <option value="1">Admin</option>
              <option value="2">Customer</option>
            </select>
          </div>

          <div>
            <button type="submit" class="primary">Create User</button>
          </div>
        </div>
      </form>
      <p id="form-status" class="message"></p>
    </section>

    <!-- User List Panel -->
    <section class="panel">
      <h2>System Users (INNER JOIN Report)</h2>
      <p id="status" class="message loading">Loading users...</p>

      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Username</th>
            <th>Assigned Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Centralized Script Dependencies -->
  <script src="config.js"></script>
  <script>
    const USERS_API = `${API_BASE_URL}/users`;

    // Fetch and display users using memory-buffered DOM rendering
    async function loadUsers() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Loading users...';
      statusEl.className = 'message loading';

      try {
        const response = await fetch(USERS_API);
        if (!response.ok) throw new Error('Failed to fetch user list');
        
        const data = await response.json();
        statusEl.textContent = 'Data loaded successfully!';
        statusEl.className = 'message success';

        renderListOptimized(
          'userTableBody',
          data,
          user => `
            <tr>
              <td>#${user.user_id}</td>
              <td><strong>${user.username}</strong></td>
              <td><span class="status-tag pending">${user.role_name}</span></td>
              <td>
                <button class="delete-btn" onclick="deleteUser(${user.user_id})">Delete</button>
              </td>
            </tr>
          `,
          'No users registered yet.'
        );
      } catch (error) {
        setStatusMessage('status', error.message, true);
      }
    }

    // Create a new user (POST)
    document.getElementById('createUserForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const role_id = document.getElementById('role_id').value;

      try {
        const response = await fetch(USERS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role_id })
        });

        if (!response.ok) throw new Error('Failed to create user');

        setStatusMessage('form-status', 'User created successfully!', false);
        this.reset();
        loadUsers();
      } catch (error) {
        setStatusMessage('form-status', error.message, true);
      }
    });

    // Delete a user (DELETE)
    async function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;

      try {
        const response = await fetch(`${USERS_API}/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete user');

        loadUsers();
      } catch (error) {
        alert(`Error deleting user: ${error.message}`);
      }
    }

    // Initialize list on load
    window.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
